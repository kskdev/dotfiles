# 未知のテーマ名は modern を使用
%if #{==:#{@theme_legacy},on}
color_base='colour235'
color_text='colour250'
color_main='colour110'
color_hint='colour221'
%else
color_base='#262626'
color_text='#bcbcbc'
color_main='#87afd7'
color_hint='#ffd75f'
%endif

%if #{&&:#{==:#{@theme_name},molokai},#{==:#{@theme_legacy},on}}
color_base='colour235'
color_text='colour253'
color_main='colour199'
color_hint='colour118'
%endif

%if #{&&:#{==:#{@theme_name},molokai},#{!=:#{@theme_legacy},on}}
color_base='#262626'
color_text='#dadada'
color_main='#ff00af'
color_hint='#87ff00'
%endif

%if #{&&:#{==:#{@theme_name},iceberg},#{==:#{@theme_legacy},on}}
color_base='colour237'
color_text='colour249'
color_main='colour117'
color_hint='colour147'
%endif

%if #{&&:#{==:#{@theme_name},iceberg},#{!=:#{@theme_legacy},on}}
color_base='#3a3a3a'
color_text='#b2b2b2'
color_main='#87d7ff'
color_hint='#afafff'
%endif

%if #{&&:#{==:#{@theme_name},tender},#{==:#{@theme_legacy},on}}
color_base='colour235'
color_text='colour195'
color_main='colour214'
color_hint='colour148'
%endif

%if #{&&:#{==:#{@theme_name},tender},#{!=:#{@theme_legacy},on}}
color_base='#262626'
color_text='#d7ffff'
color_main='#ffaf00'
color_hint='#afd700'
%endif

%if #{==:#{@theme_legacy},on}
color_pane='colour234'
%else
color_pane='#232323'
%endif

# ---------------------------------------
# Basic utatus uar setting.
# ---------------------------------------
# ステータスバーの基本色
set-option -g status-style bg=${color_base},fg=${color_text},dim

# ウィンドウタイトルの基本色
set-window-option -g window-status-style fg=${color_text},bg=${color_base},dim

# 非操作中のウィンドウでプロセスが走っているウィンドウタイトルの色
set-window-option -g window-status-activity-style fg=${color_hint},bg=${color_base},dim

# 操作中のウィンドウタイトルの色
set-window-option -g window-status-current-style fg=${color_main},bg=${color_base},bright

# ---------------------------------------
# Basic pane setting.
# ---------------------------------------
# ペインボーダー(枠)の基本色
%if #{==:#{@theme_legacy},on}
set-option -g pane-border-style fg=colour240,bg=default
%else
set-option -g pane-border-style fg=#585858,bg=default
%endif

# 操作中のペインボーダーの色
set-option -g pane-active-border-style fg=${color_main},bg=default

# 矢印を使わず境界線の色で選択側を表示
set-window-option -g pane-border-indicators colour

# 選択中のペインを見出しの印とテーマ色で強調
set-window-option -g pane-border-status top
set-window-option -g pane-border-format "#{?pane_active,#[fg=${color_main}]#[bold] ● #P #{pane_current_command} ,#[fg=${color_text}]#[dim] #P #{pane_current_command} }#[default]"

# ペインの基本色
set-option -g window-style fg=default,bg=default
# 操作中のペインの色
set-option -g window-active-style fg=default,bg=${color_pane}

# tmuxメッセージの基本色
set-option -g message-style fg=${color_base},bg=${color_text}

